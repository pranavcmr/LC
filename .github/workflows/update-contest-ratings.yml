name: Update LeetCode Contest Ratings

on:
  schedule:
    - cron: '0 0 */4 * *' # Run every 4 days
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-contest-ratings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Run Contest Rating Update Script
        run: python scripts/update_progress.py --skip-progress

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'LeetCode Bot'
          git config --global user.email 'bot@noreply.github.com'
          git add frontend/public/contest-ratings.json
          git commit -m "Update contest ratings [skip ci]" || exit 0
          git push
